<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Entrenamiento - Permits City</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM UMD -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .blueprint-bg {
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 0),
                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px, 40px 40px, 40px 40px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const RESOURCES = [
            {
                id: "1",
                title: "Guía General de Permisos",
                url: "https://drive.google.com",
                category: "Fundamentos",
                description: "Documentación base para el flujo de trabajo y normativas generales."
            },
            {
                id: "2",
                title: "Plantilla de Presentación",
                url: "https://canva.com",
                category: "Herramientas",
                description: "Recursos gráficos y formatos corporativos editables."
            },
            {
                id: "3",
                title: "Matriz de Códigos de Edificación",
                url: "https://sheets.google.com",
                category: "Operaciones",
                description: "Requisitos de permisos por municipio y normativas específicas."
            }
        ];

        function App() {
            // Estados principales
            const [completed, setCompleted] = useState(() => {
                const saved = localStorage.getItem("permits_completed");
                return saved ? JSON.parse(saved) : [];
            });
            const [darkTheme, setDarkTheme] = useState(true);
            const [blueprintMode, setBlueprintMode] = useState(true);
            const [bgType, setBgType] = useState("gradient");
            const [customSolidColor, setCustomSolidColor] = useState("#0f172a");
            
            // Estados del reproductor de Audio
            const [isPlaying, setIsPlaying] = useState(false);
            const [autoplayBlocked, setAutoplayBlocked] = useState(false);
            const audioRef = useRef(null);

            // -------------------------------------------------------------
            // LÓGICA DE AUDIO: AUTOPLAY + FALLBACK DE INTERACCIÓN INICIAL
            // -------------------------------------------------------------
            useEffect(() => {
                const audio = audioRef.current;
                if (!audio) return;

                audio.volume = 0.5;

                const attemptPlay = () => {
                    const playPromise = audio.play();
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                setIsPlaying(true);
                                setAutoplayBlocked(false);
                            })
                            .catch((error) => {
                                console.warn("Autoplay bloqueado por el navegador:", error);
                                setIsPlaying(false);
                                setAutoplayBlocked(true);
                            });
                    }
                };

                // 1. Intentar reproducción automática al montar
                attemptPlay();

                // 2. Fallback: Escuchar la primera interacción del usuario si fue bloqueado
                const handleUserInteraction = () => {
                    if (audio.paused) {
                        audio.play()
                            .then(() => {
                                setIsPlaying(true);
                                setAutoplayBlocked(false);
                                removeListeners();
                            })
                            .catch((err) => console.error("Error al reproducir tras interacción:", err));
                    } else {
                        removeListeners();
                    }
                };

                const removeListeners = () => {
                    window.removeEventListener("click", handleUserInteraction);
                    window.removeEventListener("touchstart", handleUserInteraction);
                    window.removeEventListener("keydown", handleUserInteraction);
                };

                window.addEventListener("click", handleUserInteraction);
                window.addEventListener("touchstart", handleUserInteraction);
                window.addEventListener("keydown", handleUserInteraction);

                return () => removeListeners();
            }, []);

            // Lucide Icons Render
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Persistir completados
            useEffect(() => {
                localStorage.setItem("permits_completed", JSON.stringify(completed));
            }, [completed]);

            const toggleComplete = (id) => {
                setCompleted(prev => 
                    prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]
                );
            };

            const toggleAudioManual = () => {
                if (!audioRef.current) return;
                if (isPlaying) {
                    audioRef.current.pause();
                    setIsPlaying(false);
                } else {
                    audioRef.current.play()
                        .then(() => {
                            setIsPlaying(true);
                            setAutoplayBlocked(false);
                        })
                        .catch(err => console.error("Error al reproducir audio:", err));
                }
            };

            return (
                <div 
                    style={{ backgroundColor: bgType === "custom-solid" ? customSolidColor : undefined }}
                    className={`min-h-screen transition-colors duration-300 ${
                        bgType === "gradient" 
                            ? (darkTheme ? "bg-slate-900 text-slate-100" : "bg-slate-100 text-slate-900")
                            : (darkTheme ? "text-slate-100" : "text-slate-900")
                    } ${blueprintMode ? "blueprint-bg" : ""}`}
                >
                    {/* Elemento de Audio NATIVO */}
                    <audio 
                        ref={audioRef} 
                        src="https://dl.dropboxusercontent.com/s/143e11m3b6k9qg7/welcome_guide.mp3" 
                        preload="auto"
                    />

                    {/* Banner de Notificación de Autoplay Bloqueado */}
                    {autoplayBlocked && (
                        <div className="fixed top-4 right-4 z-50 bg-blue-600 text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 text-sm animate-bounce">
                            <i data-lucide="volume-x" className="w-4 h-4"></i>
                            <span>Haz clic en cualquier lugar para activar el audio de bienvenida</span>
                        </div>
                    )}

                    {/* Header */}
                    <header className="border-b border-slate-700/50 backdrop-blur bg-slate-900/40 sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="p-2 bg-blue-600 rounded-lg text-white">
                                    <i data-lucide="file-check-2" className="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-xl tracking-tight">Permits City</h1>
                                    <p className="text-xs text-slate-400">Portal de Entrenamiento Operativo</p>
                                </div>
                            </div>

                            {/* Controles del Header */}
                            <div className="flex items-center gap-3">
                                {/* Botón de Audio */}
                                <button 
                                    onClick={toggleAudioManual}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 border transition ${
                                        isPlaying 
                                            ? "bg-emerald-600/20 border-emerald-500 text-emerald-300" 
                                            : "bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700"
                                    }`}
                                >
                                    <i data-lucide={isPlaying ? "volume-2" : "volume-x"} className="w-4 h-4"></i>
                                    <span>{isPlaying ? "Audio Activo" : "Reproducir Guía"}</span>
                                </button>

                                {/* Botón Fondo Blueprint */}
                                <button 
                                    onClick={() => setBlueprintMode(!blueprintMode)}
                                    className={`p-2 rounded-lg border transition ${
                                        blueprintMode 
                                            ? "bg-blue-600/20 border-blue-500 text-blue-400" 
                                            : "border-slate-700 hover:bg-slate-800"
                                    }`}
                                    title="Modo Retícula/AutoCAD"
                                >
                                    <i data-lucide="grid" className="w-4 h-4"></i>
                                </button>

                                {/* Selector de Color Personalizado */}
                                <input 
                                    type="color" 
                                    value={customSolidColor}
                                    onChange={(e) => {
                                        setBgType("custom-solid");
                                        setCustomSolidColor(e.target.value);
                                    }}
                                    className="w-8 h-8 rounded cursor-pointer border border-slate-700 bg-transparent"
                                    title="Color de Fondo Personalizado"
                                />

                                {/* Botón Tema Claro/Oscuro */}
                                <button 
                                    onClick={() => setDarkTheme(!darkTheme)}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${
                                        darkTheme 
                                            ? 'bg-blue-600 hover:bg-blue-500 text-white' 
                                            : 'bg-slate-800 hover:bg-slate-700 text-white'
                                    }`}
                                >
                                    {darkTheme ? "Modo Oscuro" : "Modo Claro"}
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Contenido Principal */}
                    <main className="max-w-6xl mx-auto px-6 py-8">
                        <div className="mb-8 bg-slate-800/40 border border-slate-700/50 rounded-xl p-6 backdrop-blur">
                            <h2 className="text-2xl font-bold mb-2">Bienvenido al Portal de Capacitación</h2>
                            <p className="text-slate-400 text-sm max-w-2xl">
                                Explora la documentación técnica, manuales de procedimiento y recursos necesarios para la gestión eficiente de permisos de construcción e inspecciones.
                            </p>
                        </div>

                        {/* Grid de Recursos */}
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {RESOURCES.map((resource) => {
                                const isDone = completed.includes(resource.id);
                                return (
                                    <div 
                                        key={resource.id} 
                                        className={`border rounded-xl p-5 flex flex-col justify-between transition-all duration-200 backdrop-blur ${
                                            isDone 
                                                ? "bg-emerald-950/20 border-emerald-500/40" 
                                                : "bg-slate-800/50 border-slate-700/60 hover:border-slate-500"
                                        }`}
                                    >
                                        <div>
                                            <div className="flex justify-between items-start mb-3">
                                                <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-500/10 text-blue-400 border border-blue-500/20">
                                                    {resource.category}
                                                </span>
                                                <button 
                                                    onClick={() => toggleComplete(resource.id)}
                                                    className={`p-1.5 rounded-lg border transition ${
                                                        isDone 
                                                            ? "bg-emerald-500 text-slate-950 border-emerald-400" 
                                                            : "border-slate-600 text-slate-400 hover:text-white"
                                                    }`}
                                                >
                                                    <i data-lucide={isDone ? "check-circle-2" : "circle"} className="w-4 h-4"></i>
                                                </button>
                                            </div>
                                            <h3 className="font-bold text-lg mb-2">{resource.title}</h3>
                                            <p className="text-slate-400 text-xs mb-4 leading-relaxed">{resource.description}</p>
                                        </div>

                                        <a 
                                            href={resource.url} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="mt-4 inline-flex items-center justify-center gap-2 px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-semibold transition"
                                        >
                                            <span>Acceder al Recurso</span>
                                            <i data-lucide="external-link" className="w-3.5 h-3.5"></i>
                                        </a>
                                    </div>
                                );
                            })}
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
